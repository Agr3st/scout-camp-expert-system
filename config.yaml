logging:
  level: INFO
  file: logs/app.log

linguistic_colors:
  
  # Moduł pogodowy
  wiatr:
    słaby: "#2ca02c"        # zielony
    umiarkowany: "#1f77b4"  # niebieski
    silny: "#ff7f0e"        # pomarańczowy
    wichura: "#d62728"      # czerwony

  temperatura:
    niska: "#d62728"        # czerwony
    umiarkowana: "#2ca02c"  # zielony
    wysoka: "#d62728"       # czerwony

  deszcz:
    brak: "#2ca02c"         # zielony
    lekki: "#2ca02c"        # zielony
    umiarkowany: "#1f77b4"  # niebieski
    ulewny: "#d62728"       # czerwony

  burza:
    nie: "#2ca02c"          # zielony
    tak: "#d62728"          # czerwony

  zagrożenie:
    niskie: "#2ca02c"       # zielony
    średnie: "#ff7f0e"      # niebieski
    wysokie: "#d62728"      # czerwony

  # Moduł organizacyjny
  liczba_uczestnikow:
    mała: "#2ca02c"         # zielony
    średnia: "#ff7f0e"      # niebieski
    duża: "#d62728"         # czerwony

  doswiadczenie_kadry:
    małe: "#d62728"        # zielony
    średnie: "#1f77b4"     # niebieski
    duże: "#2ca02c"        # zielony

  ryzyko_organizacyjne:
    niskie: "#2ca02c"       # zielony
    średnie: "#ff7f0e"      # niebieski
    wysokie: "#d62728"      # czerwony

  # Moduł terenowy
  odleglosc_od_schronienia:
    mała: "#2ca02c"      # zielony
    średnia: "#ff7f0e"     # niebieski
    duża: "#d62728"        # czerwony

  trudnosc_terenu:
    mała: "#2ca02c"        # zielony
    średnia: "#ff7f0e"     # niebieski
    duża: "#d62728"        # czerwony

  ryzyko_terenowe:
    niskie: "#2ca02c"       # zielony
    średnie: "#ff7f0e"      # niebieski
    wysokie: "#d62728"      # czerwony

weather_rules:
  # TEMPERATURA NISKA
  - if:
      temperatura: niska
      wiatr: słaby
      deszcz: lekki
    then:
      zagrozenie: niskie
  - if:
      temperatura: niska
      wiatr: słaby
      deszcz: umiarkowany
    then:
      zagrozenie: średnie
  - if:
      temperatura: niska
      wiatr: słaby
      deszcz: ulewny
    then:
      zagrozenie: średnie
  - if:
      temperatura: niska
      wiatr: umiarkowany
      deszcz: lekki
    then:
      zagrozenie: niskie
  - if:
      temperatura: niska
      wiatr: umiarkowany
      deszcz: umiarkowany
    then:
      zagrozenie: średnie
  - if:
      temperatura: niska
      wiatr: umiarkowany
      deszcz: ulewny
    then:
      zagrozenie: średnie
  - if:
      temperatura: niska
      wiatr: silny
      deszcz: lekki
    then:
      zagrozenie: średnie
  - if:
      temperatura: niska
      wiatr: silny
      deszcz: umiarkowany
    then:
      zagrozenie: wysokie
  - if:
      temperatura: niska
      wiatr: silny
      deszcz: ulewny
    then:
      zagrozenie: wysokie
  - if:
      temperatura: niska
      wiatr: wichura
      deszcz: lekki
    then:
      zagrozenie: wysokie
  - if:
      temperatura: niska
      wiatr: wichura
      deszcz: umiarkowany
    then:
      zagrozenie: wysokie
  - if:
      temperatura: niska
      wiatr: wichura
      deszcz: ulewny
    then:
      zagrozenie: wysokie

  # TEMPERATURA UMIARKOWANA
  - if:
      temperatura: umiarkowana
      wiatr: słaby
      deszcz: lekki
    then:
      zagrozenie: niskie
  - if:
      temperatura: umiarkowana
      wiatr: słaby
      deszcz: umiarkowany
    then:
      zagrozenie: niskie
  - if:
      temperatura: umiarkowana
      wiatr: słaby
      deszcz: ulewny
    then:
      zagrozenie: średnie
  - if:
      temperatura: umiarkowana
      wiatr: umiarkowany
      deszcz: lekki
    then:
      zagrozenie: niskie
  - if:
      temperatura: umiarkowana
      wiatr: umiarkowany
      deszcz: umiarkowany
    then:
      zagrozenie: niskie
  - if:
      temperatura: umiarkowana
      wiatr: umiarkowany
      deszcz: ulewny
    then:
      zagrozenie: średnie
  - if:
      temperatura: umiarkowana
      wiatr: silny
      deszcz: lekki
    then:
      zagrozenie: średnie
  - if:
      temperatura: umiarkowana
      wiatr: silny
      deszcz: umiarkowany
    then:
      zagrozenie: wysokie
  - if:
      temperatura: umiarkowana
      wiatr: silny
      deszcz: ulewny
    then:
      zagrozenie: wysokie
  - if:
      temperatura: umiarkowana
      wiatr: wichura
      deszcz: lekki
    then:
      zagrozenie: wysokie
  - if:
      temperatura: umiarkowana
      wiatr: wichura
      deszcz: umiarkowany
    then:
      zagrozenie: wysokie
  - if:
      temperatura: umiarkowana
      wiatr: wichura
      deszcz: ulewny
    then:
      zagrozenie: wysokie

  # TEMPERATURA WYSOKA
  - if:
      temperatura: wysoka
      wiatr: słaby
      deszcz: lekki
    then:
      zagrozenie: wysokie
  - if:
      temperatura: wysoka
      wiatr: słaby
      deszcz: umiarkowany
    then:
      zagrozenie: średnie
  - if:
      temperatura: wysoka
      wiatr: słaby
      deszcz: ulewny
    then:
      zagrozenie: średnie
  - if:
      temperatura: wysoka
      wiatr: umiarkowany
      deszcz: lekki
    then:
      zagrozenie: wysokie
  - if:
      temperatura: wysoka
      wiatr: umiarkowany
      deszcz: umiarkowany
    then:
      zagrozenie: średnie
  - if:
      temperatura: wysoka
      wiatr: umiarkowany
      deszcz: ulewny
    then:
      zagrozenie: średnie
  - if:
      temperatura: wysoka
      wiatr: silny
      deszcz: lekki
    then:
      zagrozenie: średnie
  - if:
      temperatura: wysoka
      wiatr: silny
      deszcz: umiarkowany
    then:
      zagrozenie: średnie
  - if:
      temperatura: wysoka
      wiatr: silny
      deszcz: ulewny
    then:
      zagrozenie: średnie
  - if:
      temperatura: wysoka
      wiatr: wichura
      deszcz: lekki
    then:
      zagrozenie: wysokie
  - if:
      temperatura: wysoka
      wiatr: wichura
      deszcz: umiarkowany
    then:
      zagrozenie: wysokie
  - if:
      temperatura: wysoka
      wiatr: wichura
      deszcz: ulewny
    then:
      zagrozenie: wysokie

organization_rules:
  - if:
      liczba_uczestnikow: mała
      doswiadczenie_kadry: małe
    then:
      ryzyko_organizacyjne: średnie
  - if:
      liczba_uczestnikow: mała
      doswiadczenie_kadry: średnie
    then:
      ryzyko_organizacyjne: niskie
  - if:
      liczba_uczestnikow: mała
      doswiadczenie_kadry: duże
    then:
      ryzyko_organizacyjne: niskie

  - if:
      liczba_uczestnikow: średnia
      doswiadczenie_kadry: małe
    then:
      ryzyko_organizacyjne: średnie
  - if:
      liczba_uczestnikow: średnia
      doswiadczenie_kadry: średnie
    then:
      ryzyko_organizacyjne: niskie
  - if:
      liczba_uczestnikow: średnia
      doswiadczenie_kadry: duże
    then:
      ryzyko_organizacyjne: niskie

  - if:
      liczba_uczestnikow: duża
      doswiadczenie_kadry: małe
    then:
      ryzyko_organizacyjne: wysokie
  - if:
      liczba_uczestnikow: duża
      doswiadczenie_kadry: średnie
    then:
      ryzyko_organizacyjne: wysokie
  - if:
      liczba_uczestnikow: duża
      doswiadczenie_kadry: duże
    then:
      ryzyko_organizacyjne: średnie

terrain_rules:
  - if:
      odleglosc_od_schronienia: mała
      trudnosc_terenu: mała
    then:
      ryzyko_terenowe: niskie
  - if:
      odleglosc_od_schronienia: mała
      trudnosc_terenu: średnia
    then:
      ryzyko_terenowe: niskie
  - if:
      odleglosc_od_schronienia: mała
      trudnosc_terenu: duża
    then:
      ryzyko_terenowe: średnie

  - if:
      odleglosc_od_schronienia: średnia
      trudnosc_terenu: mała
    then:
      ryzyko_terenowe: niskie
  - if:
      odleglosc_od_schronienia: średnia
      trudnosc_terenu: średnia
    then:
      ryzyko_terenowe: średnie
  - if:
      odleglosc_od_schronienia: średnia
      trudnosc_terenu: duża
    then:
      ryzyko_terenowe: wysokie

  - if:
      odleglosc_od_schronienia: duża
      trudnosc_terenu: mała
    then:
      ryzyko_terenowe: średnie
  - if:
      odleglosc_od_schronienia: duża
      trudnosc_terenu: średnia
    then:
      ryzyko_terenowe: wysokie
  - if:
      odleglosc_od_schronienia: duża
      trudnosc_terenu: duża
    then:
      ryzyko_terenowe: wysokie
